<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gerador de Propostas – Soluciona Acústica</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --vinho:#5C0E1E;--vinho-dk:#3A0812;--ouro:#B89A45;--ouro-lt:#D4B86A;
      --offwhite:#F8F5F0;--cinza:#E8E4DC;--cinza2:#D0C8BC;--texto:#1A1008;--texto-lt:#5A4A35;
    }
    body{font-family:'Inter',sans-serif;background:#f0ece4;color:var(--texto);min-height:100vh}

    /* ── TELA DE LOGINN PREMIUM ── */
    #login-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, var(--vinho-dk) 0%, var(--vinho) 100%);
      z-index: 9999; display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: #fff; padding: 48px 40px; border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4); width: 100%; max-width: 380px;
      border-top: 5px solid var(--ouro); text-align: center;
    }
    .login-box .logo-mark {
      margin: 0 auto 20px; width: 56px; height: 56px; font-size: 20px; border-width: 3px;
    }
    .login-box h2 {
      font-family: 'Playfair Display', serif; color: var(--vinho-dk); margin-bottom: 8px; font-size: 24px;
    }
    .login-box p.subtitle {
      font-size: 13px; color: var(--texto-lt); margin-bottom: 28px;
    }
    .login-box .field { text-align: left; margin-bottom: 20px; }
    .login-box .field label { font-size: 12px; font-weight: 600; color: var(--texto); margin-bottom: 6px; display: block; }
    .login-box .field input {
      width: 100%; border: 1.5px solid var(--cinza); padding: 12px 14px; font-size: 14px;
      border-radius: 4px; transition: all .2s; outline: none; background: var(--offwhite);
      font-family: 'Inter', sans-serif;
    }
    .login-box .field input:focus { border-color: var(--ouro); background: #fff; box-shadow: 0 0 0 3px rgba(184,154,69,0.15); }
    
    .btn-login {
      width: 100%; background: var(--vinho); color: #fff; border: none;
      padding: 14px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
      border-radius: 4px; cursor: pointer; transition: background .2s; font-family: 'Inter', sans-serif;
    }
    .btn-login:hover { background: var(--vinho-dk); }

    #login-error {
      color: #d32f2f; background: #fdecea; padding: 10px; border-radius: 4px;
      font-size: 13px; margin-top: 16px; display: none; font-weight: 500;
    }
    
    /* Quando logado, esconde o login e mostra o app */
    body.logado #login-screen { display: none; }
    body:not(.logado) .app-container { display: none; }

    /* ── HEADER ── */
    header{
      background:var(--vinho-dk);padding:0 32px;height:60px;
      display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:50;
    }
    .logo{display:flex;align-items:center;gap:12px}
    .logo-mark{
      width:34px;height:34px;border:2px solid var(--ouro);
      display:grid;place-items:center;
      font-family:'Playfair Display',serif;color:var(--ouro);font-size:12px;font-weight:700;line-height:1.1;
    }
    .logo span{font-family:'Playfair Display',serif;color:var(--ouro-lt);font-size:12px;letter-spacing:2px;text-transform:uppercase}
    .header-actions{display:flex;gap:10px}
    .btn{
      padding:8px 20px;font-size:13px;font-weight:500;cursor:pointer;
      border:none;letter-spacing:.3px;transition:all .18s;font-family:'Inter',sans-serif;
    }
    .btn-gold{background:var(--ouro);color:var(--vinho-dk)}
    .btn-gold:hover{background:var(--ouro-lt)}
    .btn-outline-gold{background:transparent;border:1.5px solid var(--ouro);color:var(--ouro)}
    .btn-outline-gold:hover{background:var(--ouro);color:var(--vinho-dk)}
    .btn-vinho{background:var(--vinho);color:#fff}
    .btn-vinho:hover{background:#7a1428}

    /* ── LAYOUT ── */
    .app{display:grid;grid-template-columns:480px 1fr;height:calc(100vh - 60px);overflow:hidden}

    /* ── FORMULÁRIO ── */
    .form-panel{
      background:#fff;overflow-y:auto;padding:28px 28px 48px;
      border-right:1px solid var(--cinza);
    }
    .form-panel::-webkit-scrollbar{width:5px}
    .form-panel::-webkit-scrollbar-thumb{background:var(--cinza2);border-radius:3px}

    .form-section{margin-bottom:28px}
    .form-section-title{
      font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
      color:var(--ouro);font-weight:600;
      padding-bottom:10px;border-bottom:1px solid var(--cinza);
      margin-bottom:16px;
    }
    .field{margin-bottom:14px}
    .field label{
      display:block;font-size:11px;font-weight:500;
      color:var(--texto-lt);letter-spacing:.3px;margin-bottom:5px;
    }
    .field input,.field textarea,.field select{
      width:100%;border:1.5px solid var(--cinza);
      padding:9px 12px;font-size:13px;
      font-family:'Inter',sans-serif;color:var(--texto);
      background:#fff;outline:none;
      transition:border-color .18s;border-radius:0;
    }
    .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--ouro)}
    .field textarea{resize:vertical;min-height:72px}
    .field select option{font-family:'Inter',sans-serif}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

    /* itens da proposta */
    .itens-header{ display:none; }
    .item-row{
      background:#faf8f5;border:1.5px solid var(--cinza);
      padding:16px;margin-bottom:18px;
      display:flex;flex-direction:column;gap:10px;
      position:relative;
    }
    .item-row-header{
      display:flex;align-items:center;
      padding-bottom:10px;border-bottom:1px solid var(--cinza);
      margin-bottom:2px;
    }
    .item-num-badge{
      font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
      color:var(--vinho);background:rgba(92,14,30,.08);padding:3px 10px;
    }
    .item-specs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .item-dims-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    .item-row-nums{
      display:grid;grid-template-columns:90px 1fr 120px;
      gap:10px;align-items:end;
      padding-top:10px;border-top:1px solid var(--cinza);margin-top:2px;
    }
    .item-num-label{font-size:10px;color:var(--texto-lt);letter-spacing:.3px;margin-bottom:4px;font-weight:500}
    .item-row input,.item-row textarea{padding:7px 10px;font-size:12px}
    /* remove setas do input number */
    .item-row input[type=number]{-moz-appearance:textfield}
    .item-row input[type=number]::-webkit-inner-spin-button,
    .item-row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    .item-total{
      font-size:12px;font-weight:600;color:var(--vinho);
      padding:7px 4px;text-align:right;
    }
    .btn-rm{
      position:absolute;top:-10px;right:-10px;
      width:22px;height:22px;background:#fff;border:1.5px solid var(--cinza2);
      color:#b09070;cursor:pointer;font-size:13px;line-height:1;
      display:grid;place-items:center;transition:all .15s;border-radius:50%;
      font-family:'Inter',sans-serif;
    }
    .btn-rm:hover{border-color:var(--vinho);color:var(--vinho);background:#fff8f8}
    .btn-add-item{
      display:inline-flex;align-items:center;gap:6px;
      background:none;border:1.5px dashed var(--cinza2);
      color:var(--texto-lt);font-size:12px;padding:7px 14px;
      cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;
      margin-top:4px;
    }
    .btn-add-item:hover{border-color:var(--ouro);color:var(--ouro)}
    .total-preview{
      background:var(--offwhite);padding:12px 16px;
      display:flex;justify-content:space-between;align-items:center;
      margin-top:10px;border-left:3px solid var(--ouro);
    }
    .total-preview span{font-size:12px;color:var(--texto-lt)}
    .total-preview strong{font-size:1.1rem;color:var(--vinho);font-family:'Playfair Display',serif}

    /* ── PREVIEW PANEL ── */
    .preview-panel{background:#e8e4dc;overflow-y:auto;padding:32px}
    .preview-panel::-webkit-scrollbar{width:5px}
    .preview-panel::-webkit-scrollbar-thumb{background:var(--cinza2);border-radius:3px}

    /* ── PROPOSTA (documento) ── */
    .proposta-doc{
      background:#fff;max-width:760px;margin:0 auto;
      box-shadow:0 4px 32px rgba(0,0,0,.12);
    }

    .doc-header{
      background:var(--vinho-dk);padding:36px 48px 28px;
      display:flex;align-items:center;justify-content:space-between;
    }
    .doc-logo-mark{
      width:56px;height:56px;border:2.5px solid var(--ouro);
      display:grid;place-items:center;
      font-family:'Playfair Display',serif;color:var(--ouro);font-size:19px;font-weight:700;
    }
    .doc-logo-name{
      font-family:'Playfair Display',serif;color:var(--ouro-lt);
      font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-top:8px;text-align:center;
    }
    .doc-header-info{text-align:right}
    .doc-header-info .doc-title{
      font-family:'Playfair Display',serif;color:#fff;font-size:1rem;font-weight:600;letter-spacing:.5px;
    }
    .doc-header-info .doc-meta{color:#c8b89a;font-size:12px;margin-top:6px;line-height:1.8}

    .doc-body{padding:40px 48px}

    .doc-empresa-grid{
      display:grid;grid-template-columns:1fr 1fr;gap:24px;
      padding-bottom:28px;border-bottom:1px solid var(--cinza);
      margin-bottom:28px;font-size:12.5px;
    }
    .doc-empresa-grid .col-title{
      font-size:10px;letter-spacing:2px;text-transform:uppercase;
      color:var(--ouro);font-weight:600;margin-bottom:10px;
    }
    .doc-empresa-grid p{color:var(--texto-lt);line-height:1.9}
    .doc-empresa-grid p strong{color:var(--texto);font-weight:500}

    .doc-section-title{
      font-family:'Playfair Display',serif;font-size:1rem;font-weight:600;
      color:var(--vinho);margin-bottom:12px;
      padding-bottom:8px;border-bottom:2px solid var(--cinza);
    }
    .doc-section{margin-bottom:28px}

    .doc-text{font-size:12.5px;color:var(--texto-lt);line-height:1.8;margin-bottom:8px}

    /* specs table */
    .doc-specs{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px}
    .doc-specs tr{border-bottom:1px solid var(--cinza)}
    .doc-specs td{padding:10px 12px;vertical-align:top}
    .doc-specs td:first-child{
      font-weight:600;color:var(--vinho);width:36%;
      background:#faf8f5;
    }
    .doc-specs td:last-child{color:var(--texto-lt)}

    /* itens/preço */
    .doc-itens-header{
      display:grid;grid-template-columns:1fr 60px 110px 110px;
      gap:8px;background:var(--vinho);
      padding:10px 14px;font-size:11px;color:rgba(255,255,255,.85);
      font-weight:500;letter-spacing:.3px;
    }
    .doc-item-row{
      display:grid;grid-template-columns:1fr 60px 110px 110px;
      gap:8px;padding:12px 14px;
      border-bottom:1px solid var(--cinza);font-size:12.5px;
    }
    .doc-item-row:nth-child(even){background:#faf8f5}
    .doc-item-row .num{text-align:center}
    .doc-item-row .val{text-align:right}
    .doc-total-row{
      display:flex;justify-content:flex-end;align-items:center;gap:20px;
      padding:16px 14px;border-top:2.5px solid var(--vinho);margin-top:2px;
    }
    .doc-total-row .lbl{font-size:12px;color:var(--texto-lt)}
    .doc-total-row .val{
      font-family:'Playfair Display',serif;font-size:1.6rem;
      color:var(--vinho);font-weight:700;
    }

    /* condições */
    .doc-cond-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px}
    .doc-cond-box{background:#faf8f5;padding:14px 16px;border-left:3px solid var(--ouro)}
    .doc-cond-box h4{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ouro);margin-bottom:8px}
    .doc-cond-box ul{list-style:none;padding:0}
    .doc-cond-box li{font-size:12px;color:var(--texto-lt);padding:3px 0 3px 14px;position:relative;line-height:1.5}
    .doc-cond-box li::before{content:'–';position:absolute;left:0;color:var(--ouro)}

    /* passos */
    .doc-passos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .doc-passo{
      display:flex;gap:12px;align-items:flex-start;
      background:#faf8f5;padding:12px 14px;
    }
    .doc-passo-num{
      font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--cinza2);
      font-weight:700;line-height:1;flex-shrink:0;width:24px;
    }
    .doc-passo p{font-size:12px;color:var(--texto-lt);line-height:1.5}

    /* footer do doc */
    .doc-footer{
      background:var(--vinho-dk);padding:22px 48px;
      text-align:center;
    }
    .doc-footer p{color:#c8b89a;font-size:11.5px;line-height:1.9}
    .doc-footer a{color:var(--ouro-lt);text-decoration:none}
    .doc-footer .doc-footer-title{
      font-family:'Playfair Display',serif;color:var(--ouro);
      font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;
    }

    /* ── RESPONSIVIDADE (Celulares e Tablets) ── */
    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
        height: auto;
        overflow-y: visible;
      }
      .form-panel {
        border-right: none;
        border-bottom: 2px solid var(--cinza);
        max-height: 50vh;
      }
      .preview-panel {
        padding: 16px;
      }
      .doc-body {
        padding: 24px 20px;
      }
      .doc-header {
        padding: 24px 20px;
        flex-direction: column;
        text-align: center;
        gap: 16px;
      }
      .doc-header-info {
        text-align: center;
      }
      .doc-empresa-grid, .doc-cond-grid, .doc-passos {
        grid-template-columns: 1fr;
      }
      .doc-item-row > div {
        grid-template-columns: 1fr !important;
        gap: 4px !important;
      }
      .doc-item-row .num, .doc-item-row .val {
        text-align: left !important;
      }
      .doc-itens-header { display: none; }
    }

    /* ── PRINT ── */
    @media print{
      body{background:#fff}
      header,.form-panel,.preview-panel > :not(.proposta-doc), #login-screen {display:none!important}
      .app{display:block;height:auto;overflow:visible;}
      .preview-panel{padding:0;background:#fff;overflow:visible}
      .proposta-doc{box-shadow:none;max-width:100%}
    }
  </style>
</head>
<body>

<!-- ════ TELA DE LOGIN ════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo-mark">S<br>A</div>
    <h2>Soluciona Acústica</h2>
    <p class="subtitle">Acesso restrito ao gerador de propostas</p>
    
    <div class="field">
      <label>Usuário</label>
      <input type="text" id="input-usuario" placeholder="Digite seu usuário" onkeypress="if(event.key === 'Enter') fazerLogin()"/>
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="input-senha" placeholder="Digite sua senha" onkeypress="if(event.key === 'Enter') fazerLogin()"/>
    </div>
    
    <button class="btn-login" onclick="fazerLogin()">Entrar no Sistema</button>
    
    <div id="login-error">Usuário ou senha incorretos!</div>
  </div>
</div>

<!-- ════ SISTEMA (Só aparece após logar) ════ -->
<div class="app-container">
  <header>
    <div class="logo">
      <div class="logo-mark">S<br>A</div>
      <span>Soluciona Acústica</span>
    </div>
    <div class="header-actions">
      <!-- Novo botão de sair -->
      <button class="btn btn-outline-gold" onclick="fazerLogout()" style="border-color: transparent; color: var(--cinza2)">Sair</button>
      <button class="btn btn-outline-gold" onclick="limparForm()">Limpar</button>
      <button class="btn btn-vinho" onclick="window.print()">🖨 Imprimir / PDF</button>
    </div>
  </header>

  <div class="app">

    <!-- ════ FORMULÁRIO ════ -->
    <div class="form-panel">

      <!-- Dados da proposta -->
      <div class="form-section">
        <div class="form-section-title">Dados da Proposta</div>
        <div class="row2">
          <div class="field">
            <label>Nº da Proposta</label>
            <input type="text" id="numProposta" value="" oninput="render()"/>
          </div>
          <div class="field">
            <label>Data</label>
            <input type="date" id="dataProposta" oninput="render()"/>
          </div>
        </div>
        <div class="field">
          <label>Vendedor Responsável</label>
          <input type="text" id="vendedor" value="" oninput="render()"/>
        </div>
      </div>

      <!-- Cliente -->
      <div class="form-section">
        <div class="form-section-title">Dados do Cliente</div>
        <div class="field">
          <label>Nome do Cliente</label>
          <input type="text" id="cliente" placeholder="Nome completo" oninput="render()"/>
        </div>
        <div class="row3">
          <div class="field">
            <!-- Máscara de CEP -->
            <label>CEP da Obra</label>
            <input type="text" id="cep" placeholder="00000-000" maxlength="9" oninput="mascaraCEP(this); render()"/>
          </div>
          <div class="field">
            <!-- Máscara de Telefone -->
            <label>Telefone</label>
            <input type="text" id="telefone" placeholder="(11) 99999-9999" maxlength="15" oninput="mascaraTelefone(this); render()"/>
          </div>
          <div class="field">
            <!-- E-mail / Gmail -->
            <label>E-mail</label>
            <input type="email" id="email" placeholder="cliente@gmail.com" oninput="render()"/>
          </div>
        </div>
      </div>

      <!-- Itens / Preço -->
      <div class="form-section">
        <div class="form-section-title">Itens da Proposta</div>
        <div id="itensContainer"></div>
        <button class="btn-add-item" onclick="addItem()">+ Adicionar item</button>
        <div class="total-preview">
          <span>Total geral</span>
          <strong id="totalGeral">R$ 0,00</strong>
        </div>
      </div>

      <!-- Condições -->
      <div class="form-section">
        <div class="form-section-title">Condições Comerciais</div>
        <div class="field">
          <label>Prazo de entrega</label>
          <input type="text" id="prazo" value="" oninput="render()"/>
        </div>
        
        <!-- Instalação (Botão de Seleção) -->
        <div class="field">
          <label>Instalação</label>
          <select id="instalacao" onchange="render()">
            <option value="">Selecione...</option>
            <option value="Sim">Sim</option>
            <option value="Não">Não</option>
          </select>
        </div>

        <!-- Forma de Pagamento (Botão de Seleção) -->
        <div class="field">
          <label>Forma de pagamento</label>
          <select id="pagamento" onchange="render()">
            <option value="">Selecione...</option>
            <option value="Pix">Pix</option>
            <option value="Cartão de crédito">Cartão de crédito</option>
            <option value="Cartão de débito">Cartão de débito</option>
            <option value="Boleto">Boleto</option>
            <option value="Dinheiro">Dinheiro</option>
          </select>
        </div>
        
        <div class="field">
          <label>Validade da proposta</label>
          <input type="text" id="validade" value="" oninput="render()"/>
        </div>
        <div class="field">
          <label>Observações adicionais</label>
          <textarea id="obs" placeholder="Ex: serviços de alvenaria não inclusos..." oninput="render()"></textarea>
        </div>
      </div>

      <!-- Garantia -->
      <div class="form-section">
        <div class="form-section-title">Garantia</div>
        <div class="row2">
          <div class="field">
            <label>Período de garantia</label>
            <input type="text" id="garantia" value="" oninput="render()"/>
          </div>
          <div class="field">
            <!-- Calendário -->
            <label>Contado a partir de</label>
            <input type="date" id="garantiaBase" oninput="render()"/>
          </div>
        </div>
        <div class="field">
          <label>O que não cobre</label>
          <textarea id="garantiaExc" oninput="render()"></textarea>
        </div>
      </div>

    </div><!-- /form-panel -->

    <!-- ════ PREVIEW ════ -->
    <div class="preview-panel">
      <div class="proposta-doc" id="proposta-doc">
        <!-- renderizado por JS -->
      </div>
    </div>

  </div><!-- /app -->
</div><!-- /app-container -->

<script>
// ─── LÓGICA DE LOGIN ─────────────────────────────────────────

// USUÁRIO E SENHA DE ACESSO
const USUARIO_CORRETO = "geisiane";
const SENHA_CORRETA = "0000";

function verificarAutenticacao() {
  const autenticado = localStorage.getItem('sa_autenticado');
  if (autenticado === 'sim') {
    document.body.classList.add('logado');
  }
}

function fazerLogin() {
  const u = document.getElementById('input-usuario').value;
  const p = document.getElementById('input-senha').value;

  if (u === USUARIO_CORRETO && p === SENHA_CORRETA) {
    localStorage.setItem('sa_autenticado', 'sim');
    document.getElementById('login-error').style.display = 'none';
    document.body.classList.add('logado');
  } else {
    document.getElementById('login-error').style.display = 'block';

// ─── MÁSCARAS DE INPUT ───────────────────────────────────────
function mascaraCEP(input) {
  let v = input.value.replace(/\D/g, ""); 
  v = v.replace(/^(\d{5})(\d)/, "$1-$2"); 
  input.value = v;
}

function mascaraTelefone(input) {
  let v = input.value.replace(/\D/g, ""); 
  v = v.replace(/^(\d{2})(\d)/g, "($1) $2"); 
  v = v.replace(/(\d)(\d{4})$/, "$1-$2"); 
  input.value = v;
}

function mascaraMoeda(input) {
  let v = input.value.replace(/\D/g, "");
  if (v === "") { input.value = ""; return; }
  v = (parseInt(v, 10) / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  input.value = v;
}

// ─── LOCAL STORAGE (AUTO-SALVAMENTO DOS DADOS) ───────────────
function salvarRascunho() {
  const dados = {
    numProposta: g('numProposta'),
    dataProposta: g('dataProposta'),
    vendedor: g('vendedor'),
    cliente: g('cliente'),
    cep: g('cep'),
    telefone: g('telefone'),
    email: g('email'),
    prazo: g('prazo'),
    instalacao: g('instalacao'),
    pagamento: g('pagamento'),
    validade: g('validade'),
    obs: g('obs'),
    garantia: g('garantia'),
    garantiaBase: g('garantiaBase'),
    garantiaExc: g('garantiaExc'),
    itens: itens
  };
  localStorage.setItem('rascunhoPropostaSA', JSON.stringify(dados));
}

function carregarRascunho() {
  const salvo = localStorage.getItem('rascunhoPropostaSA');
  if (salvo) {
    try {
      const dados = JSON.parse(salvo);
      document.getElementById('numProposta').value = dados.numProposta || '';
      document.getElementById('dataProposta').value = dados.dataProposta || new Date().toISOString().split('T')[0];
      document.getElementById('vendedor').value = dados.vendedor || '';
      document.getElementById('cliente').value = dados.cliente || '';
      document.getElementById('cep').value = dados.cep || '';
      document.getElementById('telefone').value = dados.telefone || '';
      document.getElementById('email').value = dados.email || '';
      document.getElementById('prazo').value = dados.prazo || '';
      document.getElementById('instalacao').value = dados.instalacao || '';
      document.getElementById('pagamento').value = dados.pagamento || '';
      document.getElementById('validade').value = dados.validade || '';
      document.getElementById('obs').value = dados.obs || '';
      document.getElementById('garantia').value = dados.garantia || '';
      document.getElementById('garantiaBase').value = dados.garantiaBase || '';
      document.getElementById('garantiaExc').value = dados.garantiaExc || '';
      
      if (dados.itens && dados.itens.length > 0) {
        itens = dados.itens;
      }
    } catch (e) {
      console.error("Erro ao carregar rascunho", e);
    }
  } else {
    document.getElementById('dataProposta').value = new Date().toISOString().split('T')[0];
  }
}

// ─── ITENS ───────────────────────────────────────────────────
let itens = [
  { nome: '', localizacao: '', produto: '', composicao: '', espessura: '', largura: '', altura: '', acabamento: '', linha: '', qtd: '', unit: '' }
];

function addItem(){
  itens.push({ nome: '', localizacao: '', produto: '', composicao: '', espessura: '', largura: '', altura: '', acabamento: '', linha: '', qtd: '', unit: '' });
  renderItens();
  render();
  salvarRascunho();
}

function removeItem(i){
  itens.splice(i,1);
  renderItens();
  render();
  salvarRascunho();
}

function updateItem(i, field, val){
  if (field === 'unit') {
    itens[i][field] = val ? parseFloat(val.replace(/\./g, '').replace(',', '.')) : '';
  } else if (field === 'qtd') {
    itens[i][field] = val ? parseFloat(val) : '';
  } else {
    itens[i][field] = val; 
  }
  
  atualizarTotais();
  render();
  salvarRascunho();
}

function atualizarTotais(){
  const total = itens.reduce((s,it)=>s + (parseFloat(it.qtd)||0)*(parseFloat(it.unit)||0), 0);
  document.getElementById('totalGeral').textContent = fmt(total);
  itens.forEach((it,i)=>{
    const el = document.getElementById('item-total-'+i);
    const v = (parseFloat(it.qtd)||0)*(parseFloat(it.unit)||0);
    if(el) el.textContent = v ? fmt(v) : '—';
  });
}

function fmt(n){
  return 'R$ ' + Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function formatarData(val){

  const [y,m,d] = val.split('-');
  return d+'/'+m+'/'+y;
}

function limparForm(){

  document.getElementById('dataProposta').value = new Date().toISOString().split('T')[0];
  
  renderItens();
  render();
}
