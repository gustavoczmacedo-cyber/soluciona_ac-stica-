<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Soluciona Acústica</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%235C0E1E'/%3E%3Ctext x='50%' y='55%' font-family='serif' font-size='50' font-weight='bold' fill='%23B89A45' dominant-baseline='middle' text-anchor='middle'%3ESA%3C/text%3E%3C/svg%3E"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  
  <!-- IMPORTAÇÃO DO SUPABASE CLIENT -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --vinho:#5C0E1E;--vinho-dk:#3A0812;--ouro:#B89A45;--ouro-lt:#D4B86A;
      --offwhite:#F8F5F0;--cinza:#E8E4DC;--cinza2:#D0C8BC;--texto:#1A1008;--texto-lt:#5A4A35;
    }
    body{font-family:'Inter',sans-serif;background:#f0ece4;color:var(--texto);min-height:100vh}

    /* ── TELA DE LOGIN ── */
    #login-screen{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:linear-gradient(135deg,var(--vinho-dk) 0%,var(--vinho) 100%);
      z-index:9999;display:flex;align-items:center;justify-content:center;
    }
    .login-box{
      background:#fff;padding:48px 40px;border-radius:8px;
      box-shadow:0 20px 60px rgba(0,0,0,0.4);width:100%;max-width:380px;
      border-top:5px solid var(--ouro);text-align:center;
    }
    .login-box .logo-mark{
      margin:0 auto 20px;width:56px;height:56px;font-size:20px;
      display:grid;place-items:center;border:2px solid var(--ouro);
      font-family:'Playfair Display',serif;color:var(--ouro);font-weight:700;line-height:1.1;
    }
    .login-box h2{font-family:'Playfair Display',serif;color:var(--vinho-dk);margin-bottom:8px;font-size:24px;}
    .login-box p.subtitle{font-size:13px;color:var(--texto-lt);margin-bottom:28px;}
    .login-box .field{text-align:left;margin-bottom:20px;}
    .login-box .field label{font-size:12px;font-weight:600;color:var(--texto);margin-bottom:6px;display:block;}
    .login-box .field input{
      width:100%;border:1.5px solid var(--cinza);padding:12px 14px;font-size:14px;
      border-radius:4px;transition:all .2s;outline:none;background:var(--offwhite);
      font-family:'Inter',sans-serif;
    }
    .login-box .field input:focus{border-color:var(--ouro);background:#fff;box-shadow:0 0 0 3px rgba(184,154,69,0.15);}
    .btn-login{
      width:100%;background:var(--vinho);color:#fff;border:none;
      padding:14px;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:1px;
      border-radius:4px;cursor:pointer;transition:background .2s;font-family:'Inter',sans-serif;
    }
    .btn-login:hover{background:var(--vinho-dk);}
    #login-error{color:#d32f2f;background:#fdecea;padding:10px;border-radius:4px;font-size:13px;margin-top:16px;display:none;font-weight:500;}
    body.logado #login-screen{display:none;}
    body:not(.logado) .app-container{display:none;}

    /* ── HEADER ── */
    header{
      background:var(--vinho-dk);padding:0 32px;height:60px;
      display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:50;
    }
    .logo{display:flex;align-items:center;gap:12px;}
    .logo-mark{
      width:34px;height:34px;border:2px solid var(--ouro);
      display:grid;place-items:center;
      font-family:'Playfair Display',serif;color:var(--ouro);font-size:12px;font-weight:700;line-height:1.1;
    }
    .logo span{font-family:'Playfair Display',serif;color:var(--ouro-lt);font-size:12px;letter-spacing:2px;text-transform:uppercase;}
    .header-actions{display:flex;gap:8px;align-items:center;}
    .btn{
      padding:8px 16px;font-size:12.5px;font-weight:500;cursor:pointer;
      border:none;letter-spacing:.3px;transition:all .18s;font-family:'Inter',sans-serif;
      border-radius:4px;
    }
    .btn-gold{background:var(--ouro);color:var(--vinho-dk);}
    .btn-gold:hover{background:var(--ouro-lt);}
    .btn-outline-gold{background:transparent;border:1.5px solid var(--ouro);color:var(--ouro);}
    .btn-outline-gold:hover{background:var(--ouro);color:var(--vinho-dk);}
    .btn-vinho{background:var(--vinho);color:#fff;}
    .btn-vinho:hover{background:#7a1428;}

    /* ── TOAST DE RASCUNHO SALVO ── */
    #toast-rascunho{
      position:fixed;bottom:24px;right:24px;background:var(--vinho-dk);color:#fff;
      padding:10px 18px;border-radius:6px;font-size:13px;font-weight:500;
      opacity:0;pointer-events:none;transition:opacity .3s;z-index:9998;
      border-left:3px solid var(--ouro);
    }
    #toast-rascunho.visivel{opacity:1;}

    /* ── MODAL HISTÓRICO ── */
    .modal-overlay{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.6);z-index:100000;
      display:none;align-items:center;justify-content:center;
      backdrop-filter:blur(4px);
    }
    .modal-box{
      background:#fff;width:100%;max-width:540px;border-radius:8px;
      padding:28px;max-height:85vh;display:flex;flex-direction:column;
      box-shadow:0 20px 60px rgba(0,0,0,0.3);
    }
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:2px solid var(--cinza);padding-bottom:12px;}
    .modal-header h3{font-family:'Playfair Display',serif;color:var(--vinho-dk);font-size:20px;}
    .btn-fechar{background:none;border:none;font-size:24px;cursor:pointer;color:var(--texto-lt);line-height:1;}
    .btn-fechar:hover{color:var(--vinho);}
    .historico-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:5px;}
    .historico-list::-webkit-scrollbar{width:5px;}
    .historico-list::-webkit-scrollbar-thumb{background:var(--cinza2);border-radius:3px;}
    .historico-item{
      border:1.5px solid var(--cinza);padding:14px;border-radius:6px;
      display:flex;justify-content:space-between;align-items:center;
      background:var(--offwhite);transition:all 0.2s;
    }
    .historico-item:hover{border-color:var(--ouro);}
    .historico-item strong{font-size:14px;color:var(--vinho);display:block;margin-bottom:4px;}
    .historico-item span{font-size:12px;color:var(--texto-lt);display:block;}
    .hist-actions{display:flex;gap:8px;}

    /* ── LAYOUT ── */
    .app{display:grid;grid-template-columns:480px 1fr;height:calc(100vh - 60px);overflow:hidden;}
    .form-panel{
      background:#fff;overflow-y:auto;padding:28px 28px 48px;
      border-right:1px solid var(--cinza);
    }
    .form-panel::-webkit-scrollbar{width:5px;}
    .form-panel::-webkit-scrollbar-thumb{background:var(--cinza2);border-radius:3px;}
    .form-section{margin-bottom:28px;}
    .form-section-title{
      font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
      color:var(--ouro);font-weight:600;
      padding-bottom:10px;border-bottom:1px solid var(--cinza);
      margin-bottom:16px;
    }
    .field{margin-bottom:14px;}
    .field label{display:block;font-size:11px;font-weight:500;color:var(--texto-lt);letter-spacing:.3px;margin-bottom:5px;}
    .field input,.field textarea,.field select{
      width:100%;border:1.5px solid var(--cinza);padding:9px 12px;font-size:13px;
      font-family:'Inter',sans-serif;color:var(--texto);background:#fff;outline:none;
      transition:border-color .18s;border-radius:0;
    }
    .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--ouro);}
    .field textarea{resize:vertical;min-height:72px;}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

    /* ITENS */
    .item-row{
      background:#faf8f5;border:1.5px solid var(--cinza);
      padding:16px;margin-bottom:18px;display:flex;flex-direction:column;gap:10px;position:relative;
    }
    .item-row-header{display:flex;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--cinza);margin-bottom:2px;}
    .item-num-badge{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--vinho);background:rgba(92,14,30,.08);padding:3px 10px;}
    .item-actions{position:absolute;top:-12px;right:-10px;display:flex;gap:6px;}
    .btn-act{
      width:24px;height:24px;background:#fff;border:1.5px solid var(--cinza2);
      border-radius:50%;display:grid;place-items:center;cursor:pointer;
      font-size:13px;font-family:'Inter',sans-serif;transition:all .15s;line-height:1;
    }
    .btn-dup{color:var(--ouro);}
    .btn-dup:hover{border-color:var(--ouro);background:#fdfaf3;}
    .btn-rm{color:#b09070;}
    .btn-rm:hover{border-color:var(--vinho);color:var(--vinho);background:#fff8f8;}
    .item-specs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .item-dims-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
    .item-row-nums{
      display:grid;grid-template-columns:90px 1fr 120px;gap:10px;align-items:end;
      padding-top:10px;border-top:1px solid var(--cinza);margin-top:2px;
    }
    .item-num-label{font-size:10px;color:var(--texto-lt);letter-spacing:.3px;margin-bottom:4px;font-weight:500;}
    .item-row input,.item-row textarea{padding:7px 10px;font-size:12px;}
    .item-row input[type=number]{-moz-appearance:textfield;}
    .item-row input[type=number]::-webkit-inner-spin-button,
    .item-row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
    .item-total{font-size:12px;font-weight:600;color:var(--vinho);padding:7px 4px;text-align:right;}
    .btn-add-item{
      display:inline-flex;align-items:center;gap:6px;background:none;border:1.5px dashed var(--cinza2);
      color:var(--texto-lt);font-size:12px;padding:7px 14px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;margin-top:4px;
    }
    .btn-add-item:hover{border-color:var(--ouro);color:var(--ouro);}
    .total-preview{
      background:var(--offwhite);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;
      margin-top:10px;border-left:3px solid var(--ouro);
    }
    .total-preview span{font-size:12px;color:var(--texto-lt);}
    .total-preview strong{font-size:1.1rem;color:var(--vinho);font-family:'Playfair Display',serif;}

    /* ── PREVIEW ── */
    .preview-panel{background:#e8e4dc;overflow-y:auto;padding:32px;}
    .preview-panel::-webkit-scrollbar{width:5px;}
    .preview-panel::-webkit-scrollbar-thumb{background:var(--cinza2);border-radius:3px;}
    .proposta-doc{background:#fff;max-width:760px;margin:0 auto;box-shadow:0 4px 32px rgba(0,0,0,.12);}

    /* CAPA */
    .capa-doc{
      background:linear-gradient(135deg,var(--vinho-dk) 0%,var(--vinho) 100%);
      height:1060px;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;color:#fff;position:relative;
      break-after:page;page-break-after:always;
    }
    .capa-conteudo{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;padding:40px;}
    .capa-logo-mark{
      width:100px;height:100px;border:4px solid var(--ouro);border-radius:4px;
      display:grid;place-items:center;margin-bottom:24px;
      font-family:'Playfair Display',serif;color:var(--ouro);font-size:38px;font-weight:700;line-height:1.1;
    }
    .capa-nome-empresa{font-family:'Playfair Display',serif;color:var(--ouro-lt);font-size:18px;letter-spacing:4px;text-transform:uppercase;margin-bottom:90px;}
    .capa-titulo{font-family:'Playfair Display',serif;font-size:4rem;color:#fff;margin-bottom:32px;font-weight:600;line-height:1.1;}
    .capa-para{font-size:14px;color:var(--cinza2);letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;}
    .capa-cliente{font-family:'Playfair Display',serif;font-size:32px;font-weight:600;color:var(--ouro);max-width:80%;line-height:1.3;}
    .capa-footer{padding-bottom:40px;font-size:13px;color:rgba(255,255,255,0.4);letter-spacing:1px;}
    .doc-header{background:var(--vinho-dk);padding:36px 48px 28px;display:flex;align-items:center;justify-content:space-between;}
    .doc-logo-mark{width:56px;height:56px;border:2.5px solid var(--ouro);display:grid;place-items:center;font-family:'Playfair Display',serif;color:var(--ouro);font-size:19px;font-weight:700;}
    .doc-logo-name{font-family:'Playfair Display',serif;color:var(--ouro-lt);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-top:8px;text-align:center;}
    .doc-header-info{text-align:right;}
    .doc-header-info .doc-title{font-family:'Playfair Display',serif;color:#fff;font-size:1rem;font-weight:600;letter-spacing:.5px;}
    .doc-header-info .doc-meta{color:#c8b89a;font-size:12px;margin-top:6px;line-height:1.8;}
    .doc-body{padding:40px 48px;}
    .doc-empresa-grid{
      display:grid;grid-template-columns:1fr 1fr;gap:24px;
      padding-bottom:28px;border-bottom:1px solid var(--cinza);margin-bottom:28px;font-size:12.5px;
    }
    .doc-empresa-grid .col-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ouro);font-weight:600;margin-bottom:10px;}
    .doc-empresa-grid p{color:var(--texto-lt);line-height:1.9;}
    .doc-empresa-grid p strong{color:var(--texto);font-weight:500;}
    .doc-section-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:600;color:var(--vinho);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--cinza);}
    .doc-section{margin-bottom:28px;}
    .doc-text{font-size:12.5px;color:var(--texto-lt);line-height:1.8;margin-bottom:8px;}
    .doc-specs{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px;}
    .doc-specs tr{border-bottom:1px solid var(--cinza);}
    .doc-specs td{padding:10px 12px;vertical-align:top;}
    .doc-specs td:first-child{font-weight:600;color:var(--vinho);width:36%;background:#faf8f5;}
    .doc-specs td:last-child{color:var(--texto-lt);}
    .doc-itens-header{
      display:grid;grid-template-columns:1fr 60px 110px 110px;gap:8px;background:var(--vinho);
      padding:10px 14px;font-size:11px;color:rgba(255,255,255,.85);font-weight:500;letter-spacing:.3px;
    }
    .doc-item-row{display:grid;grid-template-columns:1fr 60px 110px 110px;gap:8px;padding:12px 14px;border-bottom:1px solid var(--cinza);font-size:12.5px;}
    .doc-item-row:nth-child(even){background:#faf8f5;}
    .doc-item-row .num{text-align:center;}
    .doc-item-row .val{text-align:right;}
    .doc-total-row{
      display:flex;justify-content:flex-end;align-items:center;gap:20px;
      padding:16px 14px;border-top:2.5px solid var(--vinho);margin-top:2px;
    }
    .doc-total-row .lbl{font-size:12px;color:var(--texto-lt);}
    .doc-total-row .val{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--vinho);font-weight:700;}
    .doc-cond-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px;}
    .doc-cond-box{background:#faf8f5;padding:14px 16px;border-left:3px solid var(--ouro);}
    .doc-cond-box h4{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ouro);margin-bottom:8px;}
    .doc-cond-box ul{list-style:none;padding:0;}
    .doc-cond-box li{font-size:12px;color:var(--texto-lt);padding:3px 0 3px 14px;position:relative;line-height:1.5;}
    .doc-cond-box li::before{content:'–';position:absolute;left:0;color:var(--ouro);}
    .doc-passos{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .doc-passo{display:flex;gap:12px;align-items:flex-start;background:#faf8f5;padding:12px 14px;}
    .doc-passo-num{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--cinza2);font-weight:700;line-height:1;flex-shrink:0;width:24px;}
    .doc-passo p{font-size:12px;color:var(--texto-lt);line-height:1.5;}
    .doc-footer{background:var(--vinho-dk);padding:22px 48px;text-align:center;}
    .doc-footer p{color:#c8b89a;font-size:11.5px;line-height:1.9;}
    .doc-footer a{color:var(--ouro-lt);text-decoration:none;}
    .doc-footer .doc-footer-title{font-family:'Playfair Display',serif;color:var(--ouro);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}

    /* ── OBS SECTION ── */
    .doc-obs-section{margin-top:12px;padding:10px 14px;background:#faf8f5;border-left:3px solid var(--cinza2);}
    .doc-obs-section h4{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--texto-lt);margin-bottom:6px;}
    .doc-obs-section p{font-size:12px;color:var(--texto-lt);line-height:1.6;}

    /* ── RESPONSIVIDADE ── */
    @media(max-width:900px){
      .app{grid-template-columns:1fr;height:auto;overflow-y:visible;}
      .form-panel{border-right:none;border-bottom:2px solid var(--cinza);max-height:50vh;}
      .preview-panel{padding:16px;}
      .capa-doc{height:90vh;}
      .doc-body{padding:24px 20px;}
      .doc-header{padding:24px 20px;flex-direction:column;text-align:center;gap:16px;}
      .doc-header-info{text-align:center;}
      .doc-empresa-grid,.doc-cond-grid,.doc-passos{grid-template-columns:1fr;}
      .doc-itens-header{display:none;}
    }

    /* ── IMPRESSÃO ── */
    @media print{
      body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
      header,.form-panel,.preview-panel > :not(.proposta-doc),#login-screen,.modal-overlay,#toast-rascunho{display:none!important;}
      .app{display:block;height:auto;overflow:visible;}
      .preview-panel{padding:0;background:#fff;overflow:visible;}
      .proposta-doc{box-shadow:none;max-width:100%;}
      .capa-doc{height:100vh;}
    }
  </style>
</head>
<body>

<!-- ════ TOAST ════ -->
<div id="toast-rascunho">✓ Rascunho salvo</div>

<!-- ════ MODAL HISTÓRICO ════ -->
<div class="modal-overlay" id="modal-historico">
  <div class="modal-box">
    <div class="modal-header">
      <h3>🗂️ Minhas Propostas (Nuvem)</h3>
      <button class="btn-fechar" onclick="fecharHistorico()">×</button>
    </div>
    <div class="historico-list" id="lista-historico"></div>
  </div>
</div>

<!-- ════ TELA DE LOGIN ════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo-mark">S<br>A</div>
    <h2>Soluciona Acústica</h2>
    <p class="subtitle">Acesso restrito ao gerador de propostas</p>
    <div class="field">
      <label>Usuário</label>
      <input type="text" id="input-usuario" placeholder="Digite seu usuário" autocomplete="username"/>
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="input-senha" placeholder="Digite sua senha" autocomplete="current-password"/>
    </div>
    <button class="btn-login" id="btn-entrar">Entrar no Sistema</button>
    <div id="login-error">Usuário ou senha incorretos!</div>
  </div>
</div>

<!-- ════ SISTEMA ════ -->
<div class="app-container">
  <header>
    <div class="logo">
      <div class="logo-mark">S<br>A</div>
      <span>Soluciona Acústica</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline-gold" onclick="abrirHistorico()">🗂️ Histórico</button>
      <button class="btn btn-outline-gold" onclick="salvarNoHistorico()">💾 Salvar</button>
      <button class="btn btn-outline-gold" onclick="limparForm()">Limpar</button>
      <button class="btn btn-outline-gold" onclick="enviarWhatsApp()" style="display:flex;align-items:center;gap:6px;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="14" height="14" fill="currentColor">

<script>
// ─── CONFIGURAÇÃO DO SUPABASE ───
const SUPABASE_URL = 'https://jogwinptprfoznwkjbci.supabase.co';
const SUPABASE_KEY = 'sb_publishable_l_2UnfQhD0TsARBO_5B-Qw_-BVk782a';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ─── AUTENTICAÇÃO (CORRIGIDA) ───
const USER_CORRETO = "geisi";
const SENHA_CORRETA = "0000";

function verificarAutenticacao() {
  if (sessionStorage.getItem('sa_autenticado') === 'sim') {
    document.body.classList.add('logado');
  }
}

verificarAutenticacao();

function fazerLogin() {
  const u = document.getElementById('input-usuario').value.trim().toLowerCase();
  const p = document.getElementById('input-senha').value.trim();
  
  if (u === USER_CORRETO && p === SENHA_CORRETA) {
    sessionStorage.setItem('sa_autenticado', 'sim');
    document.getElementById('login-error').style.display = 'none';
    document.body.classList.add('logado');
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('input-senha').value = '';
    document.getElementById('input-senha').focus();
  }
}

function fazerLogout() {
  if (confirm("Deseja realmente sair do sistema?")) {
    sessionStorage.removeItem('sa_autenticado');
    document.body.classList.remove('logado');
    document.getElementById('input-usuario').value = '';
    document.getElementById('input-senha').value = '';
  }
}

// Eventos de login (garantindo que os elementos existem antes de registrar)
document.addEventListener('DOMContentLoaded', () => {
  const btnEntrar = document.getElementById('btn-entrar');
  if (btnEntrar) btnEntrar.addEventListener('click', fazerLogin);

  const inputSenha = document.getElementById('input-senha');
  if (inputSenha) {
    inputSenha.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') fazerLogin();
    });
  }

  const inputUsuario = document.getElementById('input-usuario');
  if (inputUsuario) {
    inputUsuario.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') fazerLogin();
    });
  }
});

// ─── MÁSCARAS ───
function mascaraCEP(input) {
  let v = input.value.replace(/\D/g, "").slice(0, 8);
  if (v.length > 5) v = v.slice(0, 5) + '-' + v.slice(5);
  input.value = v;
}

function mascaraTelefone(input) {
  let v = input.value.replace(/\D/g, "").slice(0, 11);
  if (v.length > 10) v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
  else if (v.length > 6) v = v.replace(/^(\d{2})(\d{4})(\d{0,4})$/, "($1) $2-$3");
  else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,5})$/, "($1) $2");
  input.value = v;
}

document.addEventListener('input', function(e) {
  const mask = e.target.dataset.mask;
  if (mask === 'cep') mascaraCEP(e.target);
  else if (mask === 'telefone') mascaraTelefone(e.target);
});

// ─── SANITIZAÇÃO ───
function escaparHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// ─── VALIDAÇÃO ───
function testarLocalStorage() {
  try {
    const teste = '__teste_sa__';
    localStorage.setItem(teste, teste);
    localStorage.removeItem(teste);
    return true;
  } catch(e) {
    return false;
  }
}

function validarDados() {
  const erros = [];
  if (!g('cliente').trim()) erros.push('Nome do cliente');
  if (!g('numProposta').trim()) erros.push('Número da proposta');
  if (itens.length === 0 || !itens.some(i => i.nome && i.qtd && i.unit)) {
    erros.push('Pelo menos um item com valores completos');
  }
  if (calcularTotal() === 0) erros.push('Total da proposta não pode ser zero');
  
  return { valido: erros.length === 0, erros };
}

// ─── ESTADO ───
let itens = [novoItem()];

function novoItem() {
  return { nome:'', localizacao:'', produto:'', composicao:'', espessura:'', largura:'', altura:'', acabamento:'', linha:'', qtd:'', unit:'' };
}

function g(id) { return (document.getElementById(id) || {}).value || ''; }

function fmt(n) {
  return 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatarData(val) {
  if (!val) return '—';
  try {
    const [y, m, d] = val.split('-');
    return `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${y}`;
  } catch(e) {
    return '—';
  }
}

function calcularTotal() {
  return itens.reduce((s, it) => s + (parseFloat(it.qtd) || 0) * (parseFloat(it.unit) || 0), 0);
}

// ─── RASCUNHO (LOCAL) ───
let _toastTimer = null;
function salvarRascunho() {
  if (!testarLocalStorage()) return;
  try {
    localStorage.setItem('rascunhoPropostaSA', JSON.stringify(obterDadosAtuais()));
    mostrarToast();
  } catch(e) {}
}

function mostrarToast() {
  const t = document.getElementById('toast-rascunho');
  if (!t) return;
  t.classList.add('visivel');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('visivel'), 1800);
}

function obterDadosAtuais() {
  return {
    numProposta: g('numProposta'), dataProposta: g('dataProposta'), vendedor: g('vendedor'),
    cliente: g('cliente'), cep: g('cep'), telefone: g('telefone'), email: g('email'),
    prazo: g('prazo'), instalacao: g('instalacao'), pagamento: g('pagamento'),
    validade: g('validade'), obs: g('obs'), garantia: g('garantia'),
    garantiaBase: g('garantiaBase'), garantiaExc: g('garantiaExc'),
    itens: JSON.parse(JSON.stringify(itens))
  };
}

function preencherFormulario(dados) {
  const campos = ['numProposta','dataProposta','vendedor','cliente','cep','telefone','email',
                  'prazo','instalacao','pagamento','validade','obs','garantia','garantiaBase','garantiaExc'];
  campos.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = dados[id] || '';
  });
  if (!dados.dataProposta) {
    const dataProp = document.getElementById('dataProposta');
    if (dataProp) dataProp.value = new Date().toISOString().split('T')[0];
  }
  itens = (dados.itens && dados.itens.length > 0) ? JSON.parse(JSON.stringify(dados.itens)) : [novoItem()];
  renderItens();
  render();
}

function carregarRascunho() {
  if (!testarLocalStorage()) return;
  const salvo = localStorage.getItem('rascunhoPropostaSA');
  if (salvo) {
    try {
      preencherFormulario(JSON.parse(salvo));
      return;
    } catch(e) {}
  }
  const dataProp = document.getElementById('dataProposta');
  if (dataProp) dataProp.value = new Date().toISOString().split('T')[0];
  renderItens();
  render();
}

// ─── HISTÓRICO INTEGRADO AO SUPABASE (NUVEM) ───
async function salvarNoHistorico() {
  const validacao = validarDados();
  if (!validacao.valido) {
    alert("⚠️ Não foi possível salvar. Campos obrigatórios faltando:\n\n" + validacao.erros.join('\n'));
    return;
  }

  const dadosAtuais = obterDadosAtuais();

  try {
    const { data, error } = await supabase
      .from('propostas')
      .insert([
        {
          cliente: dadosAtuais.cliente,
          num_proposta: dadosAtuais.numProposta,
          data_proposta: dadosAtuais.dataProposta || null,
          dados_completos: dadosAtuais
        }
      ]);

    if (error) {
      console.error('Erro ao salvar no Supabase:', error);
      alert('❌ Erro ao salvar no banco de dados em nuvem.');
    } else {
      alert(`✅ Proposta de ${dadosAtuais.cliente} salva com sucesso na nuvem!`);
    }
  } catch(err) {
    console.error('Erro de conexão:', err);
    alert('❌ Erro de conexão com o Supabase.');
  }
}

async function abrirHistorico() {
  const lista = document.getElementById('lista-historico');
  if (!lista) return;
  lista.innerHTML = '<p style="font-size:13px;color:var(--texto-lt);text-align:center;padding:20px;">Carregando propostas da nuvem...</p>';
  const modalHist = document.getElementById('modal-historico');
  if (modalHist) modalHist.style.display = 'flex';

  try {
    const { data: historico, error } = await supabase
      .from('propostas')
      .select('*')
      .order('data_proposta', { ascending: false });

    if (error) {
      console.error('Erro ao buscar histórico:', error);
      lista.innerHTML = '<p style="font-size:13px;color:#d32f2f;text-align:center;padding:20px;">Erro ao carregar dados do Supabase.</p>';
      return;
    }

    if (!historico || historico.length === 0) {
      lista.innerHTML = '<p style="font-size:13px;color:var(--texto-lt);text-align:center;padding:20px;">Nenhuma proposta salva na nuvem ainda.</p>';
      return;
    }

    lista.innerHTML = historico.map((p) => `
      <div class="historico-item">
        <div>
          <strong>${escaparHtml(p.cliente || '(sem nome)')}</strong>
          <span>Nº ${escaparHtml(p.num_proposta || 'S/N')} · ${formatarData(p.data_proposta)}</span>
        </div>
        <div class="hist-actions">
          <button class="btn btn-outline-gold btn-carregar-hist" data-hist-id="${p.id}">Abrir</button>
          <button class="btn btn-excluir-hist" data-hist-id="${p.id}" style="background:#fdecea;color:#d32f2f;">X</button>
        </div>
      </div>
    `).join('');

    lista.querySelectorAll('.btn-carregar-hist').forEach(btn => {
      btn.addEventListener('click', function() {
        const id = this.dataset.histId;
        if (!confirm("Isso vai substituir a proposta atual. Deseja continuar?")) return;
        const itemEncontrado = historico.find(p => p.id === id);
        if (!itemEncontrado || !itemEncontrado.dados_completos) {
          alert('❌ Proposta não encontrada.');
          return;
        }
        preencherFormulario(itemEncontrado.dados_completos);
        fecharHistorico();
        alert('✅ Proposta carregada com sucesso!');
      });
    });

    lista.querySelectorAll('.btn-excluir-hist').forEach(btn => {
      btn.addEventListener('click', async function() {
        const id = this.dataset.histId;
        if (!confirm("Tem certeza que deseja apagar essa proposta da nuvem?")) return;
        
        const { error: errDel } = await supabase
          .from('propostas')
          .delete()
          .eq('id', id);

        if (errDel) {
          alert('❌ Erro ao excluir do Supabase.');
        } else {
          abrirHistorico();
        }
      });
    });

  } catch(err) {
    console.error('Erro geral ao buscar histórico:', err);
    lista.innerHTML = '<p style="font-size:13px;color:#d32f2f;text-align:center;padding:20px;">Erro de conexão com o servidor.</p>';
  }
}

function fecharHistorico() {
  const modalHist = document.getElementById('modal-historico');
  if (modalHist) modalHist.style.display = 'none';
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    const modal = document.getElementById('modal-historico');
    if (modal && modal.style.display === 'flex') fecharHistorico();
  }
});

const modalHistoricoEl = document.getElementById('modal-historico');
if (modalHistoricoEl) {
  modalHistoricoEl.addEventListener('click', function(e) {
    if (e.target === this) fecharHistorico();
  });
}

// ─── ITENS ───
function addItem() {
  itens.push(novoItem());
  renderItens();
  render();
  salvarRascunho();
}

function removeItem(i) {
  if (itens.length === 1) { alert("A proposta precisa ter pelo menos 1 item."); return; }
  itens.splice(i, 1);
  renderItens();
  render();
  salvarRascunho();
}

function duplicarItem(i) {
  try {
    const itemClone = { ...itens[i] };
    itens.splice(i + 1, 0, itemClone);
    renderItens();
    render();
    salvarRascunho();
  } catch(e) {
    alert("❌ Erro ao duplicar item");
  }
}

function updateItem(i, field, val) {
  if (field === 'unit') {
    let num = parseFloat(val.replace(/\./g, '').replace(',', '.'));
    if (isNaN(num)) num = parseFloat(val);
    itens[i][field] = isNaN(num) ? '' : num;
  } else if (field === 'qtd') {
    const num = parseFloat(val);
    itens[i][field] = isNaN(num) ? '' : num;
  } else {
    itens[i][field] = val;
  }
  atualizarTotais();
  render();
  salvarRascunho();
}

function atualizarTotais() {
  const total = calcularTotal();
  const elTotal = document.getElementById('totalGeral');
  if (elTotal) elTotal.textContent = fmt(total);
  itens.forEach((it, i) => {
    const el = document.getElementById('item-total-' + i);
    const v = (parseFloat(it.qtd) || 0) * (parseFloat(it.unit) || 0);
    if (el) el.textContent = v ? fmt(v) : '—';
  });
}

function renderItens() {
  const c = document.getElementById('itensContainer');
  if (!c) return;
  c.innerHTML = itens.map((it, i) => {
    const v = (parseFloat(it.qtd) || 0) * (parseFloat(it.unit) || 0);
    return `
    <div class="item-row">
      <div class="item-row-header"><span class="item-num-badge">Item ${i + 1}</span></div>
      <div class="item-actions">
        <button class="btn-act btn-dup" onclick="duplicarItem(${i})" title="Duplicar item">⧉</button>
        <button class="btn-act btn-rm" onclick="removeItem(${i})" title="Remover item">×</button>
      </div>
      <div class="field">
        <label>Nome do produto</label>
        <input type="text" value="${escaparHtml(it.nome)}" placeholder="Ex: Porta acústica sala de reunião"
               oninput="updateItem(${i}, 'nome', this.value)"/>
      </div>
      <div class="item-specs-grid">
        <div class="field"><label>Localização</label>
          <input type="text" value="${escaparHtml(it.localizacao)}" placeholder="Ex: Sala principal"
                 oninput="updateItem(${i}, 'localizacao', this.value)"/>
        </div>
        <div class="field"><label>Característica do produto</label>
          <input type="text" value="${escaparHtml(it.produto)}" placeholder="Ex: Porta acústica em madeira"
                 oninput="updateItem(${i}, 'produto', this.value)"/>
        </div>
      </div>
      <div class="field"><label>Composição / Descrição técnica</label>
        <textarea rows="3" placeholder="Ex: Miolo de lã..." oninput="updateItem(${i}, 'composicao', this.value)">${escaparHtml(it.composicao)}</textarea>
      </div>
      <div class="item-dims-grid">
        <div class="field"><label>Espessura</label>
          <input type="text" value="${escaparHtml(it.espessura)}" placeholder="70 mm"
                 oninput="updateItem(${i}, 'espessura', this.value)"/>
        </div>
        <div class="field"><label>Largura</label>
          <input type="text" value="${escaparHtml(it.largura)}" placeholder="82 cm"
                 oninput="updateItem(${i}, 'largura', this.value)"/>
        </div>
        <div class="field"><label>Altura</label>
          <input type="text" value="${escaparHtml(it.altura)}" placeholder="2,10 m"
                 oninput="updateItem(${i}, 'altura', this.value)"/>
        </div>
      </div>
      <div class="item-specs-grid">
        <div class="field"><label>Acabamento</label>
          <input type="text" value="${escaparHtml(it.acabamento)}" placeholder="Ex: Formica TX branco"
                 oninput="updateItem(${i}, 'acabamento', this.value)"/>
        </div>
        <div class="field"><label>Linha</label>
          <input type="text" value="${escaparHtml(it.linha)}" placeholder="Ex: Premium..."
                 oninput="updateItem(${i}, 'linha', this.value)"/>
        </div>
      </div>
      <div class="item-row-nums">
        <div><label class="item-num-label">Qtd.</label>
          <input type="number" value="${it.qtd || ''}" min="0.01" step="0.01" placeholder="0"
                 oninput="updateItem(${i}, 'qtd', this.value)"/>
        </div>
        <div><label class="item-num-label">Vlr. Unitário (R$)</label>
          <input type="number" step="0.01" value="${it.unit || ''}" placeholder="0,00"
                 oninput="updateItem(${i}, 'unit', this.value)"/>
        </div>
        <div><label class="item-num-label">Total</label>
          <div class="item-total" id="item-total-${i}">${v ? fmt(v) : '—'}</div>
        </div>
      </div>
    </div>`;
  }).join('');
  atualizarTotais();
}

// ─── RENDER DOCUMENTO ───
function render() {
  const total = calcularTotal();
  const elTotal = document.getElementById('totalGeral');
  if (elTotal) elTotal.textContent = fmt(total);

  const itensDocs = itens.map((it, idx) => {
    const v = (parseFloat(it.qtd) || 0) * (parseFloat(it.unit) || 0);
    const temSpecs = it.localizacao || it.produto || it.composicao || it.espessura || it.largura || it.altura || it.acabamento || it.linha;
    const specsHtml = temSpecs ? `

// ─── LIMPAR ───
function limparForm() {
  if (!confirm('Isso vai apagar tudo que está na tela. Deseja continuar?')) return;
  const campos = ['numProposta','dataProposta','vendedor','cliente','cep','telefone','email',
                  'prazo','instalacao','pagamento','validade','obs','garantia','garantiaBase','garantiaExc'];
  campos.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  itens = [novoItem()];
  if (testarLocalStorage()) {
    localStorage.removeItem('rascunhoPropostaSA');
  }
  const dataProp = document.getElementById('dataProposta');
  if (dataProp) dataProp.value = new Date().toISOString().split('T')[0];
  renderItens();
  render();
}

// ─── IMPRIMIR ───
function imprimirPDF() {
  const validacao = validarDados();
  if (!validacao.valido) {
    alert("❌ Não é possível imprimir. Campos obrigatórios faltando:\n\n" + validacao.erros.join('\n'));
    return;
  }

  const clienteNome = g('cliente').trim() || 'Sem_Nome';
  const numProp = g('numProposta').trim() || 'SN';
  const nomeFormatado = `Proposta_SA_${clienteNome.replace(/\s+/g, '_')}_N${numProp}`;
  const tituloOriginal = document.title;
  document.title = nomeFormatado;
  window.print();
  setTimeout(() => { document.title = tituloOriginal; }, 1000);
}

// ─── WHATSAPP ───
function enviarWhatsApp() {
  const validacao = validarDados();
  if (!validacao.valido) {
    alert("⚠️ Preencha os dados obrigatórios antes de enviar:\n\n" + validacao.erros.join('\n'));
    return;
  }

  const cliente = g('cliente').trim();
  const num = g('numProposta').trim();
  const telefone = g('telefone').replace(/\D/g, '');
  const totalValor = calcularTotal();

  const totalText = fmt(totalValor);
  const msg = `Olá, ${cliente}! Tudo bem?\n\nAqui é da *Soluciona Acústica*. Sua proposta técnica (Nº ${num}) já está pronta.\nO valor total do projeto ficou em *${totalText}*.\n\nEstou enviando o arquivo PDF com todos os detalhes aqui abaixo. Qualquer dúvida, estou à disposição!`;
  const url = telefone.length >= 10
    ? `https://wa.me/55${telefone}?text=${encodeURIComponent(msg)}`
    : `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

// ─── LISTENERS CENTRALIZADOS COM DEBOUNCE ───
let _debounceTimer = null;
function onFormChange() {
  render();
  clearTimeout(_debounceTimer);
  _debounceTimer = setTimeout(salvarRascunho, 600);
}

const formPanel = document.getElementById('form-panel');
if (formPanel) {
  formPanel.addEventListener('input', onFormChange);
  formPanel.addEventListener('change', onFormChange);
}

// ─── INICIALIZAÇÃO ───
carregarRascunho();
</script>
